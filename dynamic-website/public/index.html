<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Web Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container">
      <h1>Dynamic Web Application</h1>
      <p>Demonstrating backend processing and dynamic REST API</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Server Status</h2>
      <div class="status-grid">
        <p><strong>Status:</strong> <span id="status">Connecting...</span></p>
        <p><strong>Server Time:</strong> <span id="serverTime">-</span></p>
        <p><strong>Uptime:</strong> <span id="uptime">-</span></p>
        <p><strong>Port:</strong> <span id="port">-</span></p>
      </div>
      <button id="refreshBtn">Refresh Status</button>
    </section>

    <section class="card">
      <h2>Dynamic Data Management</h2>
      <form id="itemForm">
        <input type="text" id="itemText" placeholder="Enter an item or task" required>
        <button type="submit">Add Item</button>
      </form>
      <ul id="itemList"></ul>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Dynamic Website on Node.js and Express</p>
    </div>
  </footer>

  <script src="client.js"></script>
</body>
</html>
